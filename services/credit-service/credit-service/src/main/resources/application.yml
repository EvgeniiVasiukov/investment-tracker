server:
  port: 8083
spring:
  application:
    name: credit-service
  datasource:
    username: ${CREDIT_DB_USERNAME}
    password: ${CREDIT_DB_PASSWORD}
    url: ${CREDIT_DB_URL}
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
jwt:
  secret: ${INVESTMENT_TRACKER_JWT_SECRET}
